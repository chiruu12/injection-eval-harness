# Marshal fleet for injection-eval-harness.
defaults:
  permission: safe-edit
  timeout_s: 3600

worktree_setup: python3 scripts/setup_worktree.py

context:
  worker: |
    An evaluation harness for prompt-injection detectors. Reproducibility is the
    product: every artifact is pinned by commit sha, every reported number is
    regenerated by `make table`, and two runs of the same checkout must produce
    byte-identical results.

    House rules:
    - Python 3.12, stdlib + the deps already in pyproject.toml. Do not add a
      dependency without saying why in the final message.
    - Protocols and dataclasses over inheritance hierarchies. No plugin registry,
      no config DSL, no async, no database. YAGNI is enforced in review.
    - Every public class and function gets a docstring saying what it is for, not
      what it does. Comments explain a decision, never restate the code.
    - No em dashes anywhere in code, comments, docstrings or markdown.
    - Tests must run with no network and no model download.

clients:
  grok:
    backend: cursor
    model: cursor-grok-4.6-high
  grok-2:
    backend: cursor
    model: cursor-grok-4.6-high
  grok-3:
    backend: cursor
    model: cursor-grok-4.6-high
  grok-4:
    backend: cursor
    model: cursor-grok-4.6-high
  grok-readonly:
    backend: cursor
    model: cursor-grok-4.6-high
    permission: read-only
  grok-readonly-2:
    backend: cursor
    model: cursor-grok-4.6-high
    permission: read-only
