[project]
name = "injection-eval-harness"
version = "0.1.0"
description = "Independent, contamination-controlled evaluation of prompt-injection detectors."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "unplug-ai[ml]",
  "datasets",
  "scikit-learn",
  "transformers",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.uv]
# Reproducibility here means the code as well as the weights. uv.lock is
# committed and CI installs with --frozen, so a new transformers or torch
# release cannot move a reported number without a visible lockfile diff.

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
# PyPI's linux torch wheel is the CUDA build and drags in ~2.5 GB of nvidia-*
# packages that nothing here uses. Every detector runs on CPU.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injection_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Tests needing the pinned model weights. `make test` stays offline; the
# reproduce workflow runs everything.
markers = ["slow: needs pinned model weights and a download"]
addopts = "-m 'not slow'"
