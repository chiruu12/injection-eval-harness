[project]
name = "injection-eval-harness"
version = "0.1.0"
description = "Independent, contamination-controlled evaluation of prompt-injection detectors."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "unplug-ai[ml]",
  "datasets",
  "scikit-learn",
  "transformers",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injection_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Tests needing the pinned model weights. `make test` stays offline; the
# reproduce workflow runs everything.
markers = ["slow: needs pinned model weights and a download"]
addopts = "-m 'not slow'"
