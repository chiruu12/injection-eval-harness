name: reproduce

# The expensive one: downloads the pinned checkpoints and datasets, regenerates
# every reported number, and fails if any of them moved. Manual and weekly rather
# than per-push, because it pulls a few hundred megabytes of model weights.
on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:00 UTC. A pin that has been yanked upstream shows up here
    # rather than the next time someone tries to reproduce a claim.
    - cron: "0 6 * * 1"

jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up the environment
        run: python3 scripts/setup_worktree.py

      # Weights are pinned by commit sha, so a hit is the same bytes as a miss.
      # Keyed on pins.py: bump a pin and the cache is rebuilt.
      - name: Cache the pinned weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/injection_eval/pins.py') }}

      - name: Fetch every pinned artifact
        run: .venv/bin/python -m injection_eval.fetch

      - name: Tests that need the pinned weights
        # Deselected from `make test`, which stays offline. This is the only
        # place the batch-invariance measurement actually runs.
        run: .venv/bin/python -m pytest -q tests -m slow

      - name: Regenerate the table and compare it to the committed one
        # --twice is exact: two runs on this runner must agree bit for bit, and
        # no tolerance applies to it. The tolerance covers only the comparison
        # against the committed baseline, which was generated on a different CPU.
        # 0.005 is the measured cross-platform envelope, not a guess: the first
        # Linux run moved raw scores by at most 2.1e-05 and every reported recall,
        # FPR, F1, ECE and bar verdict by nothing at all. One cell moved further,
        # unplug-pipeline PR-AUC under carrier at 0.0026, because average
        # precision ranks rows and float noise reorders adjacent ones. Regenerate
        # on the machine that owns the baseline and this stays at 0.
        run: >-
          .venv/bin/python scripts/check_determinism.py
          --regenerate --twice --tolerance 0.005

      - name: Render the tables
        run: .venv/bin/python -m injection_eval.report

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.sha }}
          path: results/
          retention-days: 90
